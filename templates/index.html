<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busy Agent - Chat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #chat-container {
            width: 90%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 85vh;
        }
        h2 {
            margin-top: 0;
            color: #1c1e21;
            text-align: center;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #e4e6eb;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px 16px;
            border-radius: 18px;
            max-width: 75%;
            word-wrap: break-word;
            line-height: 1.4;
        }
        .user-message {
            background-color: #0084ff;
            color: white;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .agent-message {
            background-color: #e4e6eb;
            color: #050505;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        #input-area {
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccd0d5;
            border-radius: 20px;
            outline: none;
            font-size: 16px;
        }
        #user-input:focus {
            border-color: #0084ff;
        }
        #send-button {
            padding: 0 24px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        #send-button:hover {
            background-color: #0073e6;
        }
        #send-button:disabled {
            background-color: #b0d5ff;
            cursor: not-allowed;
        }
        #system-prompt {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
        }
        #system-prompt:focus {
            border-color: #0084ff;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <h2>Busy Agent Chat</h2>
        <input type="text" id="system-prompt" placeholder="System prompt (optional)...">
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type a message..." autofocus>
            <button id="send-button">Send</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('user-input');
        const systemPromptInput = document.getElementById('system-prompt');
        const sendButton = document.getElementById('send-button');

        function appendMessage(text, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;
            messageDiv.innerText = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const systemPrompt = systemPromptInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            userInput.disabled = true;
            systemPromptInput.disabled = true;
            sendButton.disabled = true;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        message: text,
                        system_message: systemPrompt
                    })
                });

                const data = await response.json();
                if (data.error) {
                    appendMessage(`Error: ${data.error}`, 'agent');
                } else {
                    appendMessage(data.response || "No response received.", 'agent');
                }
            } catch (error) {
                appendMessage(`Connection error: ${error.message}`, 'agent');
            } finally {
                userInput.disabled = false;
                systemPromptInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
